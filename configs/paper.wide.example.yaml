# Paper research config with a 1.00% step. Still not a return forecast.
# Same fees and slippage as paper.example.yaml. Here the round trip keeps
# 1.00 - 0.10 - 0.10 - 0.05 = 0.75 percentage points, above net_target_pct,
# so the grid is allowed to enter. The 0.30% file is kept as the edge case.

mode: paper
exchange: simulated
report_currency: USDC
quote_currency: USDC
watchlist: [BTC, ETH, SOL, XRP, BNB, LINK, ADA, AVAX]
max_active_pairs: 3
starting_virtual_balance: "5000"
per_order_quote: "50"
grid_step_pct: "1.00"
net_target_pct: "0.10"
max_portfolio_exposure_pct: "40"
max_per_asset_exposure_pct: "15"
max_open_lots_per_asset: 6
min_order_book_depth_multiplier: "10"
allow_leverage: false
allow_margin: false
allow_live_trading: false
allow_withdraw: false
news_poll_interval_sec: 60
news_stale_after_sec: 600
pause_new_buys_if_unverified_high_impact: true
assumed_maker_fee_pct: "0.10"
assumed_taker_fee_pct: "0.10"
assumed_slippage_pct: "0.05"

market_stale_after_sec: 15
max_spread_pct: "0.50"
depeg_max_deviation_pct: "1.00"
max_drawdown_pct: "10"

# Runtime. `synthetic_seed` drives the labelled synthetic walk; it is not market data.
market_poll_interval_sec: 5
synthetic_seed: 7
news_fixtures_path: ""
